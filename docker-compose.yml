services:
  app:
    build: .
    environment:
      DATABASE_URL: file:/data/pageturner.db?_busy_timeout=5000&_foreign_keys=on
      PORT: "8080"
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
    ports:
      - "8080:8080"
    volumes:
      - sqlite-data:/data
    restart: unless-stopped

volumes:
  sqlite-data:
