{{define "stats_inner"}}
<div class="stat-card"><span class="stat-num">{{.Stats.Total}}</span><span class="stat-label">Total books</span></div>
<div class="stat-card"><span class="stat-num">{{.Stats.ToRead}}</span><span class="stat-label">To read</span></div>
<div class="stat-card"><span class="stat-num">{{.Stats.Reading}}</span><span class="stat-label">Reading</span></div>
<div class="stat-card"><span class="stat-num">{{.Stats.Finished}}</span><span class="stat-label">Finished</span></div>
{{end}}

{{define "stats_bar"}}
<div id="stats-bar" class="stats-grid">{{template "stats_inner" .}}</div>
{{end}}

{{define "stats_bar_oob"}}
<div id="stats-bar" hx-swap-oob="true" class="stats-grid">{{template "stats_inner" .}}</div>
{{end}}
