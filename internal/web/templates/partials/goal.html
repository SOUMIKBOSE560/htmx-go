{{define "goal_panel"}}
<div id="goal-panel" class="card goal-panel">
  <div class="goal-head">
    <h2 class="goal-title">{{.Stats.Year}} Reading Goal</h2>
    {{if .Stats.Goal}}
      <span class="goal-count">{{.Stats.FinishedYear}} of {{.Stats.Goal}} finished</span>
    {{else}}
      <span class="muted">No goal set yet</span>
    {{end}}
  </div>
  {{if .Stats.Goal}}
  <div class="progress" role="progressbar" aria-valuenow="{{.Stats.Progress}}" aria-valuemin="0" aria-valuemax="100">
    <div class="progress-fill" style="width: {{.Stats.Progress}}%"></div>
  </div>
  {{end}}
  <form class="goal-form" hx-post="/goal" hx-target="#goal-panel" hx-swap="outerHTML">
    <input type="number" name="goal" min="1" max="500" placeholder="Books per year"
           value="{{if .Stats.Goal}}{{.Stats.Goal}}{{end}}" aria-label="Yearly goal">
    <button class="btn btn-primary" type="submit">Save goal</button>
  </form>
  {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
</div>
{{end}}
