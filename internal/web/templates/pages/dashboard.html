{{define "dashboard"}}{{template "base" .}}{{end}}

{{define "content"}}
<section class="welcome">
  <div>
    <h1>Welcome back</h1>
    <p class="sub">Here's how your reading year is going.</p>
  </div>
  <div class="welcome-stat">
    <span class="welcome-stat-num">{{.Stats.Total}}</span>
    <span class="welcome-stat-label">Total books</span>
  </div>
</section>

{{template "stats_bar" .}}
{{template "goal_panel" .}}

<section class="recent">
  <div class="section-head">
    <h2 class="section-title">Recent books</h2>
    <a class="btn btn-secondary btn-sm" href="/books">View all</a>
  </div>
  <div class="markets-card">
    <div id="book-list" class="book-list">{{template "book_list" .}}</div>
  </div>
</section>
{{end}}
