{{define "markitdown"}}{{template "base" .}}{{end}}

{{define "content"}}
<section class="md-app">
  <div class="md-pane">
    <textarea id="md-input" placeholder="Paste text…" aria-label="Source text"></textarea>
  </div>
  <div class="md-rail">
    <a class="btn-outline" href="/">Home</a>
    <button class="btn-primary" id="md-convert" type="button">Convert</button>
  </div>
  <div class="md-pane">
    <div class="md-output" id="md-output" aria-live="polite"><span class="md-empty">Output will stream here.</span></div>
  </div>
</section>
<script src="/static/markitdown.js" defer></script>
{{end}}
