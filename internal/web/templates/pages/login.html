{{define "login"}}{{template "base" .}}{{end}}

{{define "content"}}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Welcome back.</h1>
    <p class="auth-sub">Log in to open the Markitdown converter.</p>
    {{if .Error}}<p class="auth-error" role="alert">{{.Error}}</p>{{end}}
    <form method="post" action="/login">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <input class="text-input" type="email" name="email" value="{{.Email}}" placeholder="Email address" required autofocus autocomplete="email">
      <input class="text-input" type="password" name="password" placeholder="Password" required autocomplete="current-password">
      <button class="btn-primary" type="submit">Continue</button>
    </form>
    <button class="btn-outline" type="button" onclick="return false;">Continue with Google</button>
    <p class="auth-fine">Protected by session cookies + double-submit CSRF. No tracking.</p>
  </div>
</div>
{{end}}
